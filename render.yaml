# Render Blueprint: one web service (built from the Dockerfile) and one managed PostgreSQL.
# Create both from the Render dashboard: New > Blueprint > choose this repository.
services:
  - type: web
    name: tokenized-treasury-lab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ttlab-postgres
          property: connectionString
      # A random 256-bit value Render creates once. It signs login cookies; never commit it.
      - key: SESSION_SECRET
        generateValue: true
      # Public demo: load the synthetic accounts and the demo users (shared public password).
      # The runner applies each seed file once, so restarts do not duplicate data.
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: ttlab-postgres
    plan: free
    postgresMajorVersion: "17"
    # Private network only: the web service can connect, the internet cannot.
    ipAllowList: []
